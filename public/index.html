<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta http-equiv="refresh" content="0; url=/components/">
<title>CAAT Design System | Components</title>
<link rel="canonical" href="/components/">

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    margin: 0;

    width: min(100% - 2rem, 36rem);

    margin: 0 0 .75rem;

    font-weight: 800;
  }

  p {
    margin: 0 0 1rem;
    color: var(--caat-muted);
