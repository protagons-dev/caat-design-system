# ─────────────────────────────────────────────────────────────────────────────
# CAAT Design System & Prototype — local development
# (Production deploys to Railway via the Dockerfile; see railway.json)
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── Design System (static site) ─────────────────────────────────────────
  designsystem:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caat-designsystem
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # nginx listens on this inside the container (template substitutes it).
      - PORT=80
    volumes:
      # Live-reload: mount public/ so changes appear without rebuilding.
      - ./public:/usr/share/nginx/html:ro
      # Mount the config as a template so the entrypoint still runs envsubst.
      - ./docker/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    labels:
      - "com.caat.project=design-system"
      - "com.caat.env=development"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  default:
    name: caat-network
