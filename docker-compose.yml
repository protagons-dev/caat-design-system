version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# CAAT Design System & Prototype
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── Design System (static site) ─────────────────────────────────────────
  designsystem:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caat-designsystem
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      # Live-reload: mount public/ so changes appear without rebuilding
      - ./public:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - NGINX_ENVSUBST_TEMPLATE_DIR=/etc/nginx/templates
    labels:
      - "com.caat.project=design-system"
      - "com.caat.env=development"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  default:
    name: caat-network
